<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:sans-serif;color:#1F2937;background:transparent;touch-action:none;user-select:none}
#app{padding:4px 16px 24px;max-width:480px;margin:0 auto}
h1{font-size:20px;margin:6px 0 12px}
.card{background:#fff;border:1px solid #EFE6DE;color:#1F2937;border-radius:18px;padding:14px;margin-bottom:12px}
.menu button{display:block;width:100%;text-align:left;background:#fff;border:1px solid #EFE6DE;color:#1F2937;border-radius:18px;padding:16px;margin-bottom:10px;font-size:17px;font-weight:bold}
.menu small{display:block;font-weight:normal;color:#6B7280;font-size:13px;margin-top:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.b{background:#C2410C;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px}
.b.w{background:#F1E8E0;color:#C2410C}
canvas{display:block;width:100%;background:#FAF5F0;border-radius:12px}
.sc{font-weight:bold;font-size:16px}
.msg{text-align:center;margin:8px 0;font-weight:bold;min-height:22px}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xo div{aspect-ratio:1;background:#FFF4EA;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:bold;color:#C2410C}
.xo div.o{color:#1F2937}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g4 div{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:26px;background:#FFF4EA;color:#1F2937}
.mem div{font-size:34px;background:#C2410C;color:transparent}
.mem div.up{background:#FFF4EA;color:#000}
.mem div.ok{background:#FED7AA;color:#000}
.gz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#E5E7EB;padding:8px;border-radius:12px}.gz button{border:0;border-radius:8px;background:#FFF4EA;font-size:26px;padding:18px 0}.gz button.hit{background:#FED7AA}.sb{text-align:center;font-size:20px;margin:8px 0;min-height:28px}
.dp{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:10px}
.dp .b{padding:14px 0;font-size:18px}
.tg{display:flex;gap:4px}.tg button{border:0;background:#F1E8E0;border-radius:8px;padding:6px 8px;font-size:15px}.tg button.on{background:#FED7AA}
.lvs{display:flex;gap:6px;margin-bottom:10px}.lvs button{flex:1;border:0;border-radius:10px;padding:9px 0;background:#F1E8E0;color:#C2410C;font-size:14px;font-weight:bold}.lvs button.on{background:#C2410C;color:#fff}
.sdg{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #1F2937;border-radius:6px;overflow:hidden;background:#fff}
.sc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:20px;border:.5px solid #E5D5C5;color:#C2410C;position:relative}
.sc.rb{border-right:2px solid #1F2937}.sc.bb{border-bottom:2px solid #1F2937}.sc.gv{color:#1F2937;font-weight:bold}
.sc.pe{background:#FFF4EA}.sc.sm{background:#FED7AA}.sc.sel{background:#FDBA74}.sc.wr{background:#FECACA;color:#B91C1C}
.nn{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:8px;color:#6B7280}.nn i{font-style:normal;display:flex;align-items:center;justify-content:center}
.sdp{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px}.sdp .b{padding:12px 0;font-size:17px}
.sw{display:flex;gap:8px;margin-top:8px;justify-content:center}.sw button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #E5D5C5}
.pop{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pop button{aspect-ratio:1;border-radius:50%;border:0;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);transition:transform .08s}.pop button.dn{transform:scale(.88);box-shadow:inset 0 5px 8px rgba(0,0,0,.35);opacity:.7}
.tray{display:flex;gap:8px;justify-content:center;margin-top:8px}.tray button{font-size:30px;background:#FFF4EA;border:1px solid #EFE6DE;border-radius:14px;width:58px;height:58px;touch-action:none}
.rest{background:#ECFDF5;color:#065F46;border-radius:12px;padding:10px;margin-bottom:10px;font-size:14px}

/* Polish chung: phản hồi chạm rõ hơn, chuyển động nhẹ và vùng bấm thân thiện */
.menu button,.b,.lvs button,.gz button,.dp .b,.sdp .b{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.menu button:active,.b:active,.lvs button:active,.gz button:active,.dp .b:active,.sdp .b:active{transform:scale(.98);filter:brightness(.97)}
.card{box-shadow:0 5px 18px rgba(80,55,35,.055)}
canvas{image-rendering:auto}

/* Sudoku: đường lưới rõ, ô chọn nổi bật và chữ co giãn theo màn hình */
.sdg{box-shadow:0 5px 16px rgba(31,41,55,.09)}
.sc{font-size:clamp(13px,4.5vw,20px);font-weight:500;transition:background .12s ease,box-shadow .12s ease}
.sc.gv{font-weight:800;color:#9A3412}
.sc.sel{box-shadow:inset 0 0 0 2px #C2410C;z-index:1}
.sc.wr{animation:tauWrong .22s ease-in-out}
@keyframes tauWrong{0%,100%{transform:translateX(0)}35%{transform:translateX(-2px)}70%{transform:translateX(2px)}}
@media(max-width:360px){#app{padding:4px 8px 18px}.card{padding:10px}.sdg{border-width:1px}.sc.rb{border-right-width:2px}.sc.bb{border-bottom-width:2px}}
</style></head><body><div id="app"></div>
<script>
var A=document.getElementById('app'),stop=null;
function best(k,v){try{var o=+localStorage.getItem('tau_best_'+k)||0;if(v!=null&&v>o){localStorage.setItem('tau_best_'+k,v);o=v}return o}catch(e){return v||0}}
var GS={snd:1,vib:1},ac=null,fsOn=false,swf=null,swm=null,sx,sy,stressT=null;
try{var _g=JSON.parse(localStorage.getItem('tau_gs')||'null');if(_g)GS=_g}catch(e){}
function saveGS(){try{localStorage.setItem('tau_gs',JSON.stringify(GS))}catch(e){}}
function beep(f,d){if(!GS.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f||440;o.type='sine';g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.08));o.stop(ac.currentTime+(d||.08)+.02)}catch(e){}}
function buzz(ms){if(!GS.vib)return;try{if(window.TauGame)TauGame.vibrate(ms||15);else if(navigator.vibrate)navigator.vibrate(ms||15)}catch(e){}}
function setFs(on){fsOn=on;try{if(window.TauGame)TauGame.fullscreen(on);else if(on)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
function exitFs(){if(fsOn)setFs(false)}
function leave(){if(stop){stop();stop=null}swf=null;swm=null}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function menu(){leave();exitFs();if(stressT){clearTimeout(stressT);stressT=null}
var lv=['D','V','K'].map(function(k){return best('snake'+k)}).join(' · ');
A.innerHTML='<h1>Trò chơi</h1><div class="menu"><button data-g="snake">🐍 Rắn săn mồi<small>Kỷ lục (Dễ · Vừa · Khó): '+lv+'</small></button><button data-g="caro">⭕❌ Cờ caro 5 quân<small>2 người hoặc đấu máy · Thắng máy: '+best('caro')+'</small></button><button data-g="sudoku">🔢 Sudoku<small>'+(sdSaved()?'Có ván đang chơi · ':'')+'Dễ, Vừa, Khó</small></button><button data-g="stress">🫧 Xả stress<small>Bóng bóng, slime, vẽ, cát… không điểm số</small></button><button data-g="g2048">🧮 2048<small>Kỷ lục: '+best('g2048')+'</small></button><button data-g="mem">🃏 Lật thẻ ghép cặp<small>Ít lượt nhất: '+(best('mem_inv')?(1000-best('mem_inv')):'chưa có')+'</small></button><button data-g="tetris">🧱 Xếp hình (Tetris)<small>Kỷ lục: '+best('tetris')+'</small></button><button data-g="pen">⚽ Sút penalty<small>Số trận thắng: '+best('pen')+'</small></button></div><div style="font-size:13px;opacity:.9">Chơi trong Tau không bị tính vào thời gian giải trí, hãy chơi có chừng mực.</div>';
A.querySelectorAll('button').forEach(function(b){b.onclick=function(){G[b.dataset.g]()}})}
function frame(title,html,back){
A.innerHTML='<div class="bar"><button class="b w" id="bk">← '+(back?'Quay lại':'Menu')+'</button><span class="sc" id="sc"></span><span class="tg"><button id="tS"></button><button id="tV"></button><button id="tF">⛶</button></span></div><div class="card">'+html+'</div>';
document.getElementById('bk').onclick=function(){leave();if(back){back()}else menu()};
function paint(){document.getElementById('tS').textContent=GS.snd?'🔊':'🔇';document.getElementById('tV').textContent=GS.vib?'📳':'📴';document.getElementById('tF').className=fsOn?'on':''}
document.getElementById('tS').onclick=function(){GS.snd=GS.snd?0:1;saveGS();paint();beep(660)};
document.getElementById('tV').onclick=function(){GS.vib=GS.vib?0:1;saveGS();paint();buzz(30)};
document.getElementById('tF').onclick=function(){setFs(!fsOn);paint()};paint()}
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchmove',function(e){if(!swm)return;var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;sx=t.clientX;sy=t.clientY;if(Math.abs(dx)>Math.abs(dy))swm(dx>0?'R':'L');else swm(dy>0?'D':'U')},{passive:true});
document.addEventListener('touchend',function(e){if(!swf)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))swf(dx>0?'R':'L');else swf(dy>0?'D':'U')},{passive:true});

var G={};

G.snake=function(){
var LV={D:{n:'Dễ',ms:260,wrap:1},V:{n:'Vừa',ms:180,wrap:0},K:{n:'Khó',ms:120,wrap:0}},lv='D';
try{lv=localStorage.getItem('tau_snlv')||'D'}catch(e){}if(!LV[lv])lv='D';
frame('','<div class="lvs" id="lvs"></div><canvas id="c" width="400" height="400"></canvas><div class="msg" id="m"></div><button class="b" id="go" style="width:100%"></button><div class="dp"><span></span><button class="b" data-d="U">▲</button><span></span><button class="b" data-d="L">◀</button><button class="b" data-d="D">▼</button><button class="b" data-d="R">▶</button></div><div style="font-size:12px;color:#6B7280;margin-top:8px;text-align:center">Dễ: đi xuyên tường · Vừa/Khó: đụng tường là thua</div>');
var c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=20,sn,dir,q,fd,sc,st,t;
function bst(){return best('snake'+lv)}
function upd(){document.getElementById('sc').textContent='Điểm '+sc+' · Kỷ lục '+bst()}
function lvBtns(){var h='';for(var k in LV)h+='<button class="'+(k==lv?'on':'')+'" data-l="'+k+'">'+LV[k].n+'</button>';var e=document.getElementById('lvs');e.innerHTML=h;e.querySelectorAll('button').forEach(function(b){b.onclick=function(){lv=b.dataset.l;try{localStorage.setItem('tau_snlv',lv)}catch(e){}init();lvBtns()}})}
function food(){do{fd={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(function(s){return s.x==fd.x&&s.y==fd.y}))}
function msg(s){document.getElementById('m').textContent=s}
function btn(){document.getElementById('go').textContent={ready:'▶ Bắt đầu',run:'⏸ Tạm dừng',pause:'▶ Tiếp tục',over:'↻ Chơi lại'}[st]}
function init(){clearInterval(t);sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir='R';q=[];sc=0;st='ready';food();msg('Bấm Bắt đầu rồi vuốt hoặc bấm mũi tên');upd();btn();draw()}
function run(){clearInterval(t);t=setInterval(step,LV[lv].ms)}
function pause(){if(st=='run'){st='pause';clearInterval(t);msg('Đang tạm dừng');btn()}}
function turn(d){if(st!='run')return;var o={U:'D',D:'U',L:'R',R:'L'},last=q.length?q[q.length-1]:dir;if(d==last||d==o[last])return;if(q.length<2)q.push(d)}
function step(){if(st!='run')return;if(q.length)dir=q.shift();var h={x:sn[0].x+(dir=='R')-(dir=='L'),y:sn[0].y+(dir=='D')-(dir=='U')};
if(LV[lv].wrap){h.x=(h.x+N)%N;h.y=(h.y+N)%N}
var tail=sn[sn.length-1],eat=h.x==fd.x&&h.y==fd.y;
if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(function(s,i){return s.x==h.x&&s.y==h.y&&(eat||s!==tail)})){st='over';clearInterval(t);best('snake'+lv,sc);buzz(80);beep(150,.3);msg('Thua rồi! Điểm: '+sc);upd();btn();return}
sn.unshift(h);if(eat){sc++;beep(700);buzz(10);food();upd()}else sn.pop();draw()}
function draw(){x.fillStyle='#FFF4EA';x.fillRect(0,0,400,400);x.fillStyle='#1F2937';x.beginPath();x.arc(fd.x*S+10,fd.y*S+10,8,0,7);x.fill();sn.forEach(function(s,i){x.fillStyle=i?'#F26B1D':'#C2410C';x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)})}
document.getElementById('go').onclick=function(){if(st=='ready'||st=='over'){if(st=='over')init();st='run';msg('');run()}else if(st=='run')pause();else if(st=='pause'){st='run';msg('');run()}btn()};
document.querySelectorAll('.dp button').forEach(function(b){b.onclick=function(){turn(b.dataset.d)}});
swm=turn;
function vis(){if(document.hidden)pause()}document.addEventListener('visibilitychange',vis);window.addEventListener('blur',pause);
stop=function(){clearInterval(t);document.removeEventListener('visibilitychange',vis);window.removeEventListener('blur',pause)};
lvBtns();init()};

G.caro=function(){
var mode='pvp',diff='V';frame('','<div class="lvs" id="md"><button data-m="pvp" class="on">2 người</button><button data-m="ai">Đấu máy</button></div><div class="lvs" id="cdiff"><button data-d="D">Dễ</button><button data-d="V" class="on">Bình thường</button><button data-d="K">Khó</button></div><canvas id="c" width="450" height="450"></canvas><div class="msg" id="m"></div><div style="display:flex;gap:8px"><button class="b w" id="un" style="flex:1">↶ Đi lại</button><button class="b" id="rs" style="flex:1">Ván mới</button></div>');
var N=15,CS=30,c=document.getElementById('c'),x=c.getContext('2d'),B,mv,turn,done,line;
function msg(s){document.getElementById('m').innerHTML=s}
function who(p){return p==1?'<span style="color:#C2410C">✕ X</span>':'<span style="color:#1F2937">◯ O</span>'}
function init(){B=[];for(var i=0;i<N;i++)B.push(Array(N).fill(0));mv=[];turn=1;done=false;line=null;st()}
function st(){document.getElementById('sc').textContent=mode=='ai'?'Bạn X · Máy O':'';msg(done?msg_:'Lượt: '+who(turn));draw()}
var msg_='';
function cnt(px,py,dx,dy,p){var n=0,a=px+dx,b=py+dy;while(a>=0&&b>=0&&a<N&&b<N&&B[b][a]==p){n++;a+=dx;b+=dy}return{n:n,open:(a>=0&&b>=0&&a<N&&b<N&&B[b][a]==0)?1:0}}
function winAt(px,py){var p=B[py][px],D=[[1,0],[0,1],[1,1],[1,-1]];for(var i=0;i<4;i++){var d=D[i],f=cnt(px,py,d[0],d[1],p),g=cnt(px,py,-d[0],-d[1],p);if(f.n+g.n+1>=5)return[[px-d[0]*g.n,py-d[1]*g.n],[px+d[0]*f.n,py+d[1]*f.n]]}return null}
function place(px,py){if(done||B[py][px])return false;B[py][px]=turn;mv.push([px,py]);beep(turn==1?520:400,.06);buzz(8);var w=winAt(px,py);if(w){done=true;line=w;msg_=who(turn)+' thắng! 🎉';if(mode=='ai'&&turn==1)best('caro',best('caro')+1);buzz(60)}else if(mv.length==N*N){done=true;msg_='Hoà, bàn cờ đã đầy'}else turn=3-turn;st();return true}
function sc(px,py,p){var D=[[1,0],[0,1],[1,1],[1,-1]],s=0;for(var i=0;i<4;i++){var d=D[i],f=cnt(px,py,d[0],d[1],p),g=cnt(px,py,-d[0],-d[1],p),n=f.n+g.n+1,o=f.open+g.open;if(n>=5)s+=100000;else if(n==4)s+=o==2?10000:o==1?1000:0;else if(n==3)s+=o==2?900:o==1?80:0;else if(n==2)s+=o==2?60:o==1?8:0;else s+=o}return s}

  if(round>=5&&you===cpu){phase='shoot';msg('Hòa sau 5 lượt! Bắt đầu luân lưu đột tử.');}
  else phase='shoot';
  if(round>=5&&you!==cpu){finish();return}
  render();
 },420);
}
function finish(){done=true;busy=false;clean();if(you>cpu){msg('BẠN THẮNG '+you+'–'+cpu+'! 🏆');best('pen',best('pen')+1)}else if(you<cpu)msg('Máy thắng '+cpu+'–'+you+'. Phục thù ván sau nhé!');else{msg('Vẫn hòa '+you+'–'+cpu+'! Đá thêm một cặp quyết định.');round=4;phase='shoot';done=false;render();return}render()}
