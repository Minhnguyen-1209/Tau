<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:sans-serif;color:#1F2937;background:transparent}
#app{padding:4px 16px 28px;max-width:520px;margin:0 auto}
h1{display:none}
.seg{display:flex;margin:0 0 12px;border-bottom:1px solid #EFE6DE}

.card h3{margin:0 0 6px;font-size:16px}
.mut{color:#6B7280;font-size:12px;line-height:1.45}
.b{background:#C2410C;color:#fff;border:0;border-radius:12px;padding:9px 14px;font-size:13px;margin:6px 6px 0 0}
.b.g{background:#E5E7EB;color:#1F2937}
.sl{margin:10px 0}
.sl label{display:flex;justify-content:space-between;font-size:14px}

.chk span.on{background:#FED7AA;border-color:#C2410C}
textarea{width:100%;border:1px solid #D1D5DB;border-radius:10px;padding:8px;font-size:14px}
.big{font-size:34px;font-weight:bold}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}
.bars div{flex:1;background:#F5A26B;border-radius:3px 3px 0 0;min-height:2px}
.bars div.hi{background:#C2410C}
.lab{display:flex;gap:3px;font-size:10px;color:#6B7280}
.lab span{flex:1;text-align:center}
.faces{display:flex;justify-content:space-between;margin:10px 0}.faces span{font-size:38px;padding:6px 8px;border-radius:14px}.faces span.on{background:#FED7AA}

.dia{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #F3F4F6;font-size:13px}.dia b{min-width:62px}.dia .sc{min-width:36px;text-align:center;font-weight:bold;color:#C2410C}

.tip.w{background:#FEE2E2}
.tip.ok{background:#DCFCE7}

.pb{height:10px;background:#E5E7EB;border-radius:5px;overflow:hidden;margin:4px 0}
.pb i{display:block;height:100%;background:#F26B1D}
.rt{border:1px solid #E5E7EB;border-radius:12px;padding:10px;margin:8px 0}
.rt b{font-size:15px}
.tm{font-size:64px;font-weight:bold;text-align:center;margin:6px 0}
.ex{font-size:24px;font-weight:bold;text-align:center}
</style></head><body><div id="app"></div>
<script>
var A=document.getElementById('app'),sub=0,wk=null,dev=null,timer=null;
function $(i){return document.getElementById(i)}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function key(d){var y=d.getFullYear(),m=d.getMonth()+1,n=d.getDate();return ''+y+(m<10?'0':'')+m+(n<10?'0':'')+n}
function dayOff(i){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);return d}
function fm(ms){var m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+'h '+(m%60)+'p':m+'p'}
function avg(a){return a.length?a.reduce(function(s,x){return s+x},0)/a.length:0}
var WD=['CN','T2','T3','T4','T5','T6','T7'];
var hasT=typeof TauApp!=='undefined';
function nat(f){if(!hasT)return null;try{return JSON.parse(TauApp[f]())}catch(e){return null}}
function tabs(){return '<h1>Bản thân</h1><div class="seg">'+['Cảm xúc','Thể thao','Báo cáo','Chăm máy'].map(function(n,i){return '<button class="'+(i==sub?'on':'')+'" onclick="go('+i+')">'+n+'</button>'}).join('')+'</div>'}
function go(i){if(timer){clearInterval(timer);timer=null}sub=i;draw()}
function draw(){A.innerHTML=tabs()+'<div id="v"></div>';[mood,sport,report,care][sub]()}

/* ---------- Cảm xúc ---------- */
var FAC=[['v','Vui vẻ',false],['e','Năng lượng',false],['z','Căng thẳng (cao là căng)',true],['s','Ngủ ngon đêm qua',false]];
var CHK=['Uống đủ nước','Có vận động','Nghỉ mắt đủ','Ngủ đủ giấc','Nói chuyện với ai đó'];
function score(m){return Math.round((m.v+m.e+(100-m.z)+m.s)/4)}
function lvl(s){return s>=75?'tốt':s>=55?'ổn':s>=40?'hơi thấp':'thấp'}
function mood(){var all=ls('tau_mood',{}),k=key(new Date()),m=all[k]||{v:60,e:60,z:40,s:60,c:[],n:''};
var FC=[['😣',15],['😕',35],['😐',55],['🙂',75],['😄',95]],cs=all[k]?score(all[k]):-1;
var h='<div class="card"><h3>Hôm nay bạn thấy thế nào?</h3><div class="mut">Chạm một khuôn mặt là xong, mất 2 giây.</div><div class="faces" id="fc">'+FC.map(function(f){return '<span data-s="'+f[1]+'" class="'+(cs>=0&&Math.abs(cs-f[1])<=10?'on':'')+'">'+f[0]+'</span>'}).join('')+'</div><div id="ms" class="mut">'+(cs>=0?'Điểm hôm nay: '+cs+'/100 ('+lvl(cs)+')':'')+'</div></div><div class="card"><details><summary>Chấm chi tiết (tuỳ chọn)</summary><div class="mut" style="margin-top:6px">Thang 0 đến 100. Riêng Căng thẳng thì càng cao càng căng.</div>';
FAC.forEach(function(f){h+='<div class="sl"><label><span>'+f[1]+'</span><b id="o'+f[0]+'">'+m[f[0]]+'</b></label><input type="range" min="0" max="100" value="'+m[f[0]]+'" oninput="$(\'o'+f[0]+'\').textContent=this.value" id="r'+f[0]+'"></div>'});
h+='<div class="mut">Hôm nay bạn đã làm được:</div><div class="chk" id="ck">'+CHK.map(function(c,i){return '<span class="'+(m.c.indexOf(i)>=0?'on':'')+'" data-i="'+i+'">'+c+'</span>'}).join('')+'</div><textarea id="nt" rows="2" placeholder="Một dòng về hôm nay (tuỳ chọn)">'+(m.n||'')+'</textarea><button class="b" onclick="saveMood()">Lưu chi tiết</button></details></div>';
h+='<div id="hist"></div><div id="adv"></div><div id="dia"></div>';$('v').innerHTML=h;
document.querySelectorAll('#fc span').forEach(function(e){e.onclick=function(){quick(+e.dataset.s)}});
document.querySelectorAll('#ck span').forEach(function(s){s.onclick=function(){s.classList.toggle('on')}});
renderHist();wk=wk||nat('weekJson');renderAdv();renderDia()}
function quick(sc){var all=ls('tau_mood',{}),k=key(new Date()),o=all[k]||{c:[],n:''};o.v=sc;o.e=sc;o.s=sc;o.z=100-sc;all[k]=o;sv('tau_mood',all);
document.querySelectorAll('#fc span').forEach(function(e){e.classList.toggle('on',+e.dataset.s==sc)});$('ms').textContent='Đã lưu. Điểm hôm nay: '+score(o)+'/100 ('+lvl(score(o))+')';renderHist();renderAdv();renderDia()}
function renderDia(){var all=ls('tau_mood',{}),work=ls('tau_work',{}),h='<div class="card"><h3>Nhật ký 3 tuần</h3><div class="mut">Xem lại mỗi ngày bạn đã làm gì: cảm xúc, thể thao, thời gian dùng điện thoại, app dùng nhiều nhất.</div>';
for(var i=0;i<21;i++){var d=dayOff(i),k=key(d),m=all[k],wm=work[k]||0,sd=wk&&wk.days?wk.days.filter(function(x){return x.k==k})[0]:null;
var parts=[];if(wm)parts.push('tập '+wm+'p');if(sd&&sd.t>0)parts.push('máy '+fm(sd.t)+(sd.a?' · '+sd.a:''));if(m&&m.c&&m.c.length)parts.push(m.c.length+'/5 thói quen');if(m&&m.n)parts.push('“'+m.n.replace(/</g,'&lt;')+'”');
if(!m&&!parts.length)continue;h+='<div class="dia"><b>'+(i==0?'Hôm nay':i==1?'Hôm qua':WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1))+'</b><span class="sc">'+(m?score(m):'–')+'</span><span>'+parts.join(' · ')+'</span></div>'}
$('dia').innerHTML=h+'</div>'}
function saveMood(){var all=ls('tau_mood',{}),c=[];document.querySelectorAll('#ck span').forEach(function(s){if(s.classList.contains('on'))c.push(+s.dataset.i)});
var m={v:+$('rv').value,e:+$('re').value,z:+$('rz').value,s:+$('rs').value,c:c,n:$('nt').value};all[key(new Date())]=m;sv('tau_mood',all);$('ms').textContent='Đã lưu. Điểm cảm xúc hôm nay: '+score(m)+'/100 ('+lvl(score(m))+')';renderHist();renderAdv();renderDia()}
function renderHist(){var all=ls('tau_mood',{}),h='<div class="card"><h3>14 ngày gần nhất</h3><div class="bars">',l='<div class="lab">',n=0,sum=0;
for(var i=13;i>=0;i--){var d=dayOff(i),m=all[key(d)],s=m?score(m):0;if(m){n++;sum+=s}h+='<div class="'+(i==0?'hi':'')+'" style="height:'+(s*.9)+'px" title="'+s+'"></div>';l+='<span>'+(i%3==0?d.getDate():'')+'</span>'}
h+='</div>'+l+'</div><div class="mut" style="margin-top:6px">'+(n?'Trung bình '+Math.round(sum/n)+'/100 trong '+n+' ngày đã chấm.':'Chưa có ngày nào được chấm.')+'</div></div>';$('hist').innerHTML=h}
function pearson(a,b){var n=a.length,ma=avg(a),mb=avg(b),sa=0,sb=0,sc=0;for(var i=0;i<n;i++){sa+=(a[i]-ma)*(a[i]-ma);sb+=(b[i]-mb)*(b[i]-mb);sc+=(a[i]-ma)*(b[i]-mb)}return sa&&sb?sc/Math.sqrt(sa*sb):0}
function renderAdv(){var all=ls('tau_mood',{}),work=ls('tau_work',{}),ent=[];
for(var i=13;i>=0;i--){var k=key(dayOff(i));if(all[k])ent.push({k:k,m:all[k],s:score(all[k]),i:i})}
var h='<div class="card"><h3>Phân tích & lời khuyên</h3>';
if(ent.length<3){$('adv').innerHTML=h+'<div class="tip">Hãy chấm điểm ít nhất 3 ngày để có phân tích. Tau sẽ nhắc bạn lúc 21:30 mỗi ngày.</div></div>';return}
var last7=ent.filter(function(e){return e.i<7}),prev7=ent.filter(function(e){return e.i>=7}),a7=avg(last7.map(function(e){return e.s}));
h+='<div class="row"><span>Điểm trung bình 7 ngày</span><b>'+Math.round(a7)+'/100 ('+lvl(a7)+')</b></div>';
if(prev7.length>=3){var d=a7-avg(prev7.map(function(e){return e.s}));h+='<div class="tip '+(d>=5?'ok':d<=-5?'w':'')+'">'+(d>=5?'Tuần này khá hơn tuần trước '+Math.round(d)+' điểm. Cứ giữ những thói quen đang làm.':d<=-5?'Tuần này thấp hơn tuần trước '+Math.round(-d)+' điểm. Thử nhìn lại điều gì đã thay đổi: giấc ngủ, công việc, thời gian dùng điện thoại.':'Điểm gần như không đổi so với tuần trước.')+'</div>'}
var fa={};FAC.forEach(function(f){fa[f[0]]=avg(last7.map(function(e){return f[2]?100-e.m[f[0]]:e.m[f[0]]}))});
var worst=FAC.slice().sort(function(a,b){return fa[a[0]]-fa[b[0]]})[0];
var T={v:'Vui vẻ đang thấp nhất. Mỗi ngày hãy làm một việc nhỏ khiến bạn thấy dễ chịu: ra nắng 10 phút, nghe một bài thích, nhắn tin cho người thân. Việc nhỏ làm đều hiệu quả hơn việc lớn làm một lần.',e:'Năng lượng đang thấp nhất. Kiểm tra ba thứ trước: ngủ đủ 7 đến 8 giờ, uống đủ nước, và vận động nhẹ 10 phút. Tab Thể thao có bài khởi động 5 phút.',z:'Căng thẳng đang cao nhất. Thử hít vào 4 giây, thở ra 6 giây, lặp lại 10 lần. Viết ra 3 việc quan trọng nhất hôm nay và chỉ làm từng việc một. Bớt tin tức và mạng xã hội trước khi ngủ.',s:'Giấc ngủ đang kém nhất. Giữ giờ ngủ cố định, tắt màn hình trước giờ ngủ 30 phút (bật Giờ đi ngủ ở tab Tập trung), tránh cà phê sau 14 giờ.'};
h+='<div class="tip w"><b>Điểm yếu nhất tuần này:</b> '+worst[1]+' (~'+Math.round(fa[worst[0]])+'/100). '+T[worst[0]]+'</div>';
CHK.forEach(function(c,ci){var w=ent.filter(function(e){return e.m.c.indexOf(ci)>=0}),wo=ent.filter(function(e){return e.m.c.indexOf(ci)<0});if(w.length>=2&&wo.length>=2){var d=avg(w.map(function(e){return e.s}))-avg(wo.map(function(e){return e.s}));if(Math.abs(d)>=8)h+='<div class="tip '+(d>0?'ok':'')+'">Ngày "'+c+'" điểm '+(d>0?'cao hơn ':'thấp hơn ')+Math.round(Math.abs(d))+' điểm so với ngày không.'+(d>0?' Nên giữ thói quen này.':'')+'</div>'}});
var wp=ent.filter(function(e){return (work[e.k]||0)>0}),wn=ent.filter(function(e){return !(work[e.k]||0)});
if(wp.length>=2&&wn.length>=2){var dd=avg(wp.map(function(e){return e.s}))-avg(wn.map(function(e){return e.s}));if(dd>=5)h+='<div class="tip ok">Ngày có tập thể thao trong Tau, điểm cao hơn '+Math.round(dd)+' điểm. Đứng dậy 10 phút cũng có ích.</div>'}
if(wk&&wk.days){var xs=[],ys=[];ent.forEach(function(e){var d=wk.days.filter(function(x){return x.k==e.k})[0];if(d&&d.t>0){xs.push(d.t/3600000);ys.push(e.s)}});
if(xs.length>=5){var r=pearson(xs,ys);if(r<=-.3)h+='<div class="tip w">Ngày dùng điện thoại nhiều thường có điểm cảm xúc thấp hơn (hệ số tương quan '+r.toFixed(2)+', '+xs.length+' ngày). Chưa chắc là nguyên nhân, nhưng đáng thử giảm một tuần xem có khác không.</div>';else if(r>=.3)h+='<div class="tip">Ngày dùng điện thoại nhiều lại không làm điểm của bạn thấp đi ('+r.toFixed(2)+'). Có thể bạn đang dùng điện thoại để học, làm việc hoặc nói chuyện, điều đó là ổn.</div>';else h+='<div class="tip">Chưa thấy mối liên hệ rõ giữa thời gian dùng điện thoại và cảm xúc của bạn ('+r.toFixed(2)+').</div>'}}
var lastN=ent.slice(-3);if(lastN.length==3&&lastN.every(function(e){return e.s<40}))h+='<div class="tip w">Ba ngày gần nhất điểm đều thấp. Hãy nói chuyện với một người bạn tin tưởng. Nếu cảm giác nặng nề kéo dài hơn hai tuần hoặc ảnh hưởng đến ăn ngủ, học và làm việc, nên gặp chuyên gia tâm lý hoặc bác sĩ.</div>';
h+='<div class="mut" style="margin-top:8px">Đây là công cụ tự theo dõi, không phải chẩn đoán y khoa.</div></div>';$('adv').innerHTML=h}

/* ---------- Hình minh hoạ động tác (người que, chạy lặp lại) ---------- */
function P(hx,hy,t,a,l){return [hx,hy,t].concat(a,l)}
var FS=P(100,110,0,[-10,-10,10,10],[-6,-6,6,6]),SS=P(100,110,0,[5,5,-5,-5],[2,2,-2,-2]);
var SQ1=P(76,144,40,[85,90,85,90],[80,-20,80,-20]),PL0=P(109,153,65,[0,0,0,0],[-65,-65,-65,-65]),JUMP=P(100,86,0,[170,175,-170,-175],[0,0,0,0]);
var ANI={
jj:{d:900,f:[FS,P(100,104,0,[-150,-160,150,160],[-28,-28,28,28])]},
run:{d:650,f:[P(100,106,10,[50,120,-50,-100],[85,5,-15,-60]),P(100,106,10,[-50,-100,50,120],[-15,-60,85,5])]},

rope:{d:520,f:[P(100,110,0,[-30,-10,30,10],[-4,-4,4,4]),P(100,98,0,[-40,-65,40,65],[-4,-22,4,22])]},
ropealt:{d:560,f:[P(100,104,0,[-35,-55,35,55],[30,-10,-5,-50]),P(100,104,0,[-35,-55,35,55],[-5,-50,30,-10])]},
squat:{d:2200,f:[P(100,110,0,[5,5,-5,-5],[2,2,-2,-2]),SQ1]},
squathold:{d:1600,f:[SQ1,P(76,141,40,[85,90,85,90],[80,-20,80,-20])]},
squatjump:{d:1500,f:[SS,SQ1,JUMP]},
lunge:{d:2200,f:[SS,P(100,141,0,[10,10,-10,-10],[80,-5,-20,-90])]},
bridge:{d:2200,f:[P(112,172,-90,[90,90,90,90],[150,20,150,20]),P(112,150,-110,[90,90,90,90],[128,2,128,2])]},
calf:{d:1400,f:[SS,P(100,102,0,[5,5,-5,-5],[2,2,-2,-2])]},
pushup:{d:2200,f:[PL0,P(115,177,83,[-100,54,-100,54],[-83,-83,-83,-83])]},

situp:{d:2200,f:[P(112,172,-88,[-110,-170,-110,-170],[150,20,150,20]),P(112,172,28,[70,90,70,90],[150,20,150,20])]},

bicycle:{d:1200,f:[P(110,170,-70,[-100,-160,-100,-160],[140,70,95,95]),P(110,170,-70,[-100,-160,-100,-160],[95,95,140,70])]},
climber:{d:560,f:[P(109,153,65,[0,0,0,0],[50,-100,-65,-65]),P(109,153,65,[0,0,0,0],[-65,-65,50,-100])]},
twist:{d:1400,f:[P(100,150,-25,[-20,-20,-20,-20],[100,95,100,95]),P(100,150,-25,[95,95,95,95],[100,95,100,95])]},
burpee:{d:3200,f:[SS,SQ1,PL0,SQ1,JUMP]},
toetouch:{d:2400,f:[SS,P(95,110,115,[5,5,5,5],[0,0,0,0])]},

function op(n){try{TauApp.openSetting(n)}catch(e){}}
function tipsHtml(){var G=[['Sạc pin',['Giữ pin trong khoảng 20 đến 80%, không cần sạc đầy 100% mỗi lần.','Dùng sạc và cáp chính hãng hoặc đạt chuẩn, tránh sạc dỏm.','Không vừa sạc vừa chơi game nặng hoặc quay video, máy sẽ nóng và pin chai nhanh.','Sạc qua đêm thì bật chế độ sạc tối ưu của máy nếu có.','Tháo ốp khi sạc nhanh nếu thấy máy nóng.']],
['Nhiệt độ',['Không để máy dưới nắng, trong xe đóng kín hoặc dưới gối khi sạc.','Máy nóng thì tắt màn hình, nghỉ vài phút, đừng bỏ vào tủ lạnh.']],
['Dọn dẹp bộ nhớ',['Xoá video và ảnh trùng, sao lưu ảnh lên đám mây rồi xoá bản trong máy.','Dọn thư mục Download và file tin nhắn (Zalo, Messenger) mỗi tháng.','Xoá cache của app nặng (TikTok, Facebook, trình duyệt) trong cài đặt app.','Gỡ app lâu không dùng, nhất là app tự khởi động nền.','Chừa trống ít nhất 15% bộ nhớ.']],
['Mượt và an toàn',['Khởi động lại máy khoảng một lần mỗi tuần.','Cập nhật hệ thống và app, chỉ cài app từ kho chính thức.','Đừng bấm vào link lạ, đặt khoá màn hình và bật tìm máy bị mất.','Dùng màn hình sáng vừa phải, bật tự động chỉnh độ sáng để tiết kiệm pin.','Làm sạch cổng sạc bằng que nhựa nhẹ nhàng nếu sạc chập chờn.']]];
return G.map(function(g){return '<div class="card"><h3>'+g[0]+'</h3>'+g[1].map(function(t){return '<div class="tip">'+t+'</div>'}).join('')+'</div>'}).join('')}
draw();
